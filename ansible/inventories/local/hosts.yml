# Phase 16 - your own machine (or a VM): ansible-playbook -i inventories/local/hosts.yml playbooks/site.yml --check
all:
  children:
    ems_hosts:
      hosts:
        localhost:
          ansible_connection: local
      vars:
        ems_environment: local
        ems_image: ems-app
        ems_image_tag: local
        ems_ecr_registry: ""
        ems_backup_bucket: ""
        ems_trusted_proxies: 1
        ems_monitoring_enabled: false
