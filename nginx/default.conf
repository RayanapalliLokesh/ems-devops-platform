# Phase 13 / 17 - nginx is the only public listener. It forwards to the app, adds a request ID and the client IP.
# In Compose and Kubernetes the app is found by its service name through DNS.
# Docker's embedded DNS. `resolve` re-reads the address when the app container is recreated with a new IP
# (without it nginx keeps the IP from its own start and answers 502 after every app redeploy).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream ems_app {
    zone ems_app 64k;
    server app:5000 resolve;
    keepalive 16;
}

# Keep the ID from an upstream proxy (the ALB sets none; a client may), otherwise make one
map $http_x_request_id $ems_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format ems_json escape=json '{"ts":"$time_iso8601","remote_addr":"$remote_addr",'
    '"xff":"$http_x_forwarded_for","request_id":"$ems_request_id","method":"$request_method",'
    '"path":"$request_uri","status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
    '"upstream_s":"$upstream_response_time","user_agent":"$http_user_agent"}';

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 16m;

    access_log /dev/stdout ems_json;
    error_log  /dev/stderr warn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # /metrics is never public: Prometheus scrapes app:5000 directly on the internal network.
    # (An allow-list of private ranges would not help: behind the ALB every client looks like 10.x.)
    location = /metrics {
        return 404;
    }

    # nginx's own health, for the container healthcheck (does not depend on the app)
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://ems_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $ems_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
