# Prometheus inside Kubernetes: find pods through the API instead of static targets (compare
# monitoring/prometheus/prometheus.yml for Compose). The app pods keep the job name "ems-app" so the
# recording and alerting rules in monitoring/prometheus/rules/ work unchanged.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: ems-k8s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [ems]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: job
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
