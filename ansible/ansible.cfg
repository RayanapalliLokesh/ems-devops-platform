[defaults]
roles_path = roles
inventory = inventories/local/hosts.yml
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = false
forks = 5

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15
