# The EMS app: the same image as Docker Compose (phase 17). The Deployment keeps 2 pods running and
# replaces any pod that dies. Probes: startup + liveness on /livez (process only), readiness on /health (DB).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-app
  labels:
    app.kubernetes.io/name: ems-app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ems-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ems-app
        app.kubernetes.io/component: web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # wait for PostgreSQL instead of crash-looping on the first start (same image: nothing extra to pull)
        - name: wait-for-postgres
          image: ems-app
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import socket, sys, time
              for attempt in range(60):
                  try:
                      socket.create_connection(("postgres", 5432), timeout=2).close()
                      sys.exit(0)
                  except OSError as error:
                      print(f"waiting for postgres:5432 ({error})", flush=True)
                      time.sleep(2)
              sys.exit(1)
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: app
          image: ems-app
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: ems-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: {name: ems-secret, key: SECRET_KEY}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: ems-secret, key: POSTGRES_PASSWORD}
            # $(VAR) is expanded by Kubernetes from the variables above (ConfigMap + Secret)
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/$(POSTGRES_DB)
            - name: GUNICORN_BIND
              value: 0.0.0.0:5000
          startupProbe:                 # gives gunicorn + DB init up to 90 s before liveness takes over
            httpGet: {path: /livez, port: http}
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:                # restart only if the process itself is stuck: never depends on the DB
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:               # take the pod out of the Service while the DB is unreachable
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 250m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp                 # PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
              mountPath: /tmp
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: data
          emptyDir: {sizeLimit: 64Mi}
        - name: logs
          emptyDir: {sizeLimit: 64Mi}
