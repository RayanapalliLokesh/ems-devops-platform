# Phase 17 - the application stack: nginx :80 -> app :5000 -> PostgreSQL :5432
# Each service starts only when the one before it is healthy. Settings come from .env (see .env.example).
name: ems

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ems}
      POSTGRES_USER: ${POSTGRES_USER:-ems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  app:
    image: ${EMS_IMAGE:-ems-app}:${EMS_IMAGE_TAG:-local}
    build:
      context: .
      args:
        APP_VERSION: ${EMS_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ems}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ems}
      APP_VERSION: ${EMS_IMAGE_TAG:-local}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-1}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      FORWARDED_ALLOW_IPS: "*"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - app-data:/app/data
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    # no-new-privileges is left out: on some AppArmor hosts it blocks every exec ("operation not permitted")
    mem_limit: 512m

  nginx:
    image: nginx:1.27.4-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${EMS_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 128m

networks:
  frontend: {}
  backend: {}

volumes:
  db-data: {}
  app-data: {}
