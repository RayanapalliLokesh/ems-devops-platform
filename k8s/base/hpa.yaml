# Phase 23 - scale between 2 and 4 pods on 70% CPU (of the request). Needs metrics-server.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ems-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ems-app
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
