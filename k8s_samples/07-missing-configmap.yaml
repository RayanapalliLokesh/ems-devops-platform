# Symptom: STATUS CreateContainerConfigError; event: configmap "s07-config" not found.
# Cause: the pod reads its environment from a ConfigMap that was never created.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s07-missing-configmap
  namespace: ems-samples
spec:
  replicas: 1
  selector:
    matchLabels: {app: s07}
  template:
    metadata:
      labels: {app: s07}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo LOG_LEVEL=$LOG_LEVEL; sleep 3600"]
          envFrom:
            - configMapRef:
                name: s07-config
          resources:
            limits: {cpu: 50m, memory: 32Mi}
