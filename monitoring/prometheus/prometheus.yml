# Phase 24 - what Prometheus scrapes, and where its alerts go
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: ems

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: ems-app                 # the Flask app itself (not through nginx: /metrics is not public)
    metrics_path: /metrics
    static_configs:
      - targets: ['app:5000']
  - job_name: node                    # the host: CPU, memory, disk (USE)
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: cadvisor                # every container: CPU, memory, restarts
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
