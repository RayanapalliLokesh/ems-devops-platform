- name: Install base packages
  ansible.builtin.dnf:
    name: "{{ common_packages }}"
    state: present
  when: ansible_facts.pkg_mgr in ['dnf', 'dnf5']

- name: Read the timezone
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: common_current_tz
  changed_when: false
  check_mode: false

- name: Set the timezone
  ansible.builtin.command: timedatectl set-timezone {{ common_timezone }}
  when: common_current_tz.stdout != common_timezone
  changed_when: true

- name: Keep the clock in sync
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true
  when: ansible_facts.pkg_mgr in ['dnf', 'dnf5']

- name: Harden SSH (keys only, no root login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-ems.conf
    owner: root
    group: root
    mode: "0600"
    content: |
      # managed by Ansible (role common)
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no
      X11Forwarding no
      MaxAuthTries 3
    validate: /usr/sbin/sshd -t -f %s
  when: ansible_connection != 'local'
  notify: Reload sshd
